<svg xmlns="http://www.w3.org/2000/svg" width="840" height="265" viewBox="-40 -40 840 265">
  <defs>
    <style>
      @keyframes windowOpen {
        0% {
          transform: scale(0.6);
          opacity: 0;
        }
        70% {
          transform: scale(1.03);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }
      .terminal-window {
        animation: windowOpen 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
        transform-origin: 380px 92.5px;
      }
    </style>

    <clipPath id="cmd1">
      <rect x="32" y="38" width="0" height="22">
        <animate attributeName="width" calcMode="discrete"
          values="0;9;17;26;34;42;51"
          keyTimes="0;0.10;0.25;0.38;0.52;0.70;0.85"
          dur="1s" begin="0.3s" fill="freeze" />
      </rect>
    </clipPath>
    <clipPath id="cmd2">
      <rect x="32" y="88" width="0" height="22">
        <animate attributeName="width" calcMode="discrete"
          values="0;9;17;26;34;42;51;59;67;76;84;93;101;109;117;126"
          keyTimes="0;0.050;0.100;0.161;0.222;0.278;0.339;0.400;0.461;0.522;0.578;0.639;0.722;0.800;0.878;0.939"
          dur="1.8s" begin="2s" fill="freeze" />
      </rect>
    </clipPath>

    <filter id="blur">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

  </defs>

  <g class="terminal-window">
    <rect x="0" y="6" width="760" height="185" rx="8" fill="#000" opacity="0.45" filter="url(#blur)"/>
    <rect width="760" height="185" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <rect width="760" height="32" rx="8" fill="#161b22" />
    <rect y="8" width="760" height="24" fill="#161b22" />
    <circle cx="18" cy="16" r="5.5" fill="#ff5f56" />
    <circle cx="36" cy="16" r="5.5" fill="#ffbd2e" />
    <circle cx="54" cy="16" r="5.5" fill="#27c93f" />
    <text x="380" y="20" text-anchor="middle" fill="#8b949e"
      font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="12">terminal</text>

    <g>
      <text x="15" y="55" fill="#79C0FF" font-family="'SF Mono','Fira Code','Courier New',monospace"
        font-size="14">$ </text>
      <text clip-path="url(#cmd1)" x="32" y="55"
        font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="14" opacity="0">
        <tspan fill="#F0F6FC">whoami<animate attributeName="fill" to="#7EE787" dur="0.001s"
            begin="1.15s" fill="freeze" /><animate attributeName="font-weight" to="bold" dur="0.001s"
            begin="1.15s" fill="freeze" /></tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.001s" begin="0.3s" fill="freeze" />
      </text>

      <text x="15" y="77" fill="#C9D1D9" font-family="'SF Mono','Fira Code','Courier New',monospace"
        font-size="14" opacity="0">luca-software-developer<animate attributeName="opacity" from="0"
          to="1" dur="0.001s" begin="1.6s" fill="freeze" /></text>

      <text x="15" y="105" fill="#79C0FF" font-family="'SF Mono','Fira Code','Courier New',monospace"
        font-size="14" opacity="0">$ <animate attributeName="opacity" from="0" to="1" dur="0.001s"
          begin="1.6s" fill="freeze" /></text>
      <text clip-path="url(#cmd2)" x="32" y="105"
        font-family="'SF Mono','Fira Code','Courier New',monospace" font-size="14" opacity="0">
        <tspan fill="#F0F6FC">cat<animate attributeName="fill" to="#7EE787" dur="0.001s" begin="2.3s"
            fill="freeze" /><animate attributeName="font-weight" to="bold" dur="0.001s" begin="2.3s"
            fill="freeze" /></tspan>
        <tspan fill="#F0F6FC"> profile.txt</tspan>
        <animate attributeName="opacity" from="0" to="1" dur="0.001s" begin="2s" fill="freeze" />
      </text>

      <text x="15" y="127" fill="#C9D1D9" font-family="'SF Mono','Fira Code','Courier New',monospace"
        font-size="14" opacity="0">Software Engineering + Cybersecurity<animate
          attributeName="opacity" from="0" to="1" dur="0.001s" begin="4.1s" fill="freeze" /></text>
      <text x="15" y="149" fill="#C9D1D9" font-family="'SF Mono','Fira Code','Courier New',monospace"
        font-size="14" opacity="0">Software, App, Game &amp; Web Developer<animate attributeName="opacity" from="0" to="1"
          dur="0.001s" begin="4.1s" fill="freeze" /></text>
    </g>

    <rect x="32" y="42" width="2" height="18" fill="#F0F6FC">
      <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1s" repeatCount="indefinite" />
      <animate attributeName="x" calcMode="discrete"
        values="32;41;49;58;66;74;83;32;32;41;49;58;66;74;83;91;99;108;116;125;133;141;149;158;15"
        keyTimes="0;0.080;0.110;0.136;0.164;0.200;0.230;0.320;0.400;0.418;0.436;0.458;0.480;0.500;0.522;0.544;0.566;0.588;0.608;0.630;0.660;0.688;0.716;0.738;0.820"
        dur="5.0s" fill="freeze" />
      <animate attributeName="y" calcMode="discrete"
        values="42;92;158"
        keyTimes="0;0.320;0.820"
        dur="5.0s" fill="freeze" />
    </rect>
  </g>
</svg>
